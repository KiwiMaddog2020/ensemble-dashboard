<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Print variant - 4-color CMYK, halftone-friendly. Gradients on the disks
       (flatter stops than HERO); flat lens fills; warm cream-white triple
       intersection for press registration; thin frame stroke. -->
  <defs>
    <linearGradient id="pBurg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#a8403a"/><stop offset="100%" stop-color="#3a0e18"/></linearGradient>
    <linearGradient id="pOchre" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#d8902a"/><stop offset="100%" stop-color="#5a2c08"/></linearGradient>
    <linearGradient id="pNavy" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#3850a0"/><stop offset="100%" stop-color="#0a1228"/></linearGradient>
    <clipPath id="pClipT"><circle cx="512" cy="298" r="270"/></clipPath>
    <clipPath id="pClipL"><circle cx="327" cy="619" r="270"/></clipPath>
    <clipPath id="pClipR"><circle cx="697" cy="619" r="270"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="#f5ede0"/>
  <circle cx="327" cy="619" r="270" fill="url(#pOchre)"/>
  <circle cx="697" cy="619" r="270" fill="url(#pNavy)"/>
  <circle cx="512" cy="298" r="270" fill="url(#pBurg)"/>
  <g clip-path="url(#pClipT)"><g clip-path="url(#pClipL)"><rect width="1024" height="1024" fill="#7a3818"/></g></g>
  <g clip-path="url(#pClipT)"><g clip-path="url(#pClipR)"><rect width="1024" height="1024" fill="#3a1858"/></g></g>
  <g clip-path="url(#pClipL)"><g clip-path="url(#pClipR)"><rect width="1024" height="1024" fill="#284824"/></g></g>
  <g clip-path="url(#pClipT)"><g clip-path="url(#pClipL)"><g clip-path="url(#pClipR)"><rect width="1024" height="1024" fill="#fff5d8"/></g></g></g>
  <rect x="1.5" y="1.5" width="1021" height="1021" fill="none" stroke="#5a2c08" stroke-width="3"/>
</svg>
