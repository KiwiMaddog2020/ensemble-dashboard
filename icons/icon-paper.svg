<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" class="ensemble-mark ensemble-mark--light">
  <defs>
    <radialGradient id="mBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="var(--mark-bg-center, #faf6ec)"/>
      <stop offset="100%" stop-color="var(--mark-bg-edge, #ede4cf)"/>
    </radialGradient>
    <radialGradient id="mHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c878" stop-opacity="0.50"/>
      <stop offset="35%" stop-color="#c89048" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#8a5018" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3a1f08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mLumin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8d480"/>
      <stop offset="40%" stop-color="#d8a050"/>
      <stop offset="80%" stop-color="#8a5018"/>
      <stop offset="100%" stop-color="#4a2808"/>
    </radialGradient>
    <radialGradient id="mVignette" cx="50%" cy="50%" r="65%">
