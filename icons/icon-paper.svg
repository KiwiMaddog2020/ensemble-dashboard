    <clipPath id="mClipT"><circle cx="512" cy="298" r="270"/></clipPath>
    <clipPath id="mClipL"><circle cx="327" cy="619" r="270"/></clipPath>
    <clipPath id="mClipR"><circle cx="697" cy="619" r="270"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#mBg)"/>
  <circle cx="512" cy="298" r="270" fill="var(--mark-primary-mid, #6b1f2c)"/>
  <circle cx="327" cy="619" r="270" fill="var(--mark-primary-dark, #c2711f)"/>
  <circle cx="697" cy="619" r="270" fill="var(--mark-primary-light, #1c2a72)"/>
  <g clip-path="url(#mClipT)"><g clip-path="url(#mClipL)"><rect width="1024" height="1024" fill="var(--mark-primary-mid, #6b1f2c)" opacity="0.55"/></g></g>
  <g clip-path="url(#mClipT)"><g clip-path="url(#mClipR)"><rect width="1024" height="1024" fill="var(--mark-primary-light, #1c2a72)" opacity="0.55"/></g></g>
  <g clip-path="url(#mClipL)"><g clip-path="url(#mClipR)"><rect width="1024" height="1024" fill="var(--mark-primary-dark, #c2711f)" opacity="0.55"/></g></g>
