<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <pattern id="craftBg" x="0" y="0" width="320" height="320" patternUnits="userSpaceOnUse">
      <rect width="320" height="320" fill="#f5f5f3"/>
      <filter id="craft">
        <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="3"/>
        <feColorMatrix values="0 0 0 0 0.20  0 0 0 0 0.16  0 0 0 0 0.10  0 0 0 0.40 0"/>
      </filter>
      <rect width="320" height="320" filter="url(#craft)" opacity="0.20"/>
    </pattern>
    <radialGradient id="ringA" cx="35%" cy="25%" r="85%"><stop offset="0%" stop-color="#474747"/><stop offset="50%" stop-color="#0a0a0a"/><stop offset="100%" stop-color="#070707"/></radialGradient>
    <radialGradient id="ringB" cx="35%" cy="25%" r="85%"><stop offset="0%" stop-color="#5c5c5c"/><stop offset="50%" stop-color="#262626"/><stop offset="100%" stop-color="#1b1b1b"/></radialGradient>
    <radialGradient id="ringC" cx="35%" cy="25%" r="85%"><stop offset="0%" stop-color="#7d7d7d"/><stop offset="50%" stop-color="#525252"/><stop offset="100%" stop-color="#393939"/></radialGradient>
    <radialGradient id="blendAB" cx="35%" cy="25%" r="85%"><stop offset="0%" stop-color="#464646"/><stop offset="50%" stop-color="#181818"/><stop offset="100%" stop-color="#0e0e0e"/></radialGradient>
    <radialGradient id="blendAC" cx="35%" cy="25%" r="85%"><stop offset="0%" stop-color="#585858"/><stop offset="50%" stop-color="#2e2e2e"/><stop offset="100%" stop-color="#1c1c1c"/></radialGradient>
    <radialGradient id="blendBC" cx="35%" cy="25%" r="85%"><stop offset="0%" stop-color="#636363"/><stop offset="50%" stop-color="#3c3c3c"/><stop offset="100%" stop-color="#242424"/></radialGradient>
    <radialGradient id="vLumin" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f8d480"/><stop offset="40%" stop-color="#d8a050"/><stop offset="80%" stop-color="#8a5018"/><stop offset="100%" stop-color="#4a2808"/></radialGradient>
    <radialGradient id="vHalo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f5c878" stop-opacity="0.50"/><stop offset="35%" stop-color="#c89048" stop-opacity="0.25"/><stop offset="70%" stop-color="#8a5018" stop-opacity="0.08"/><stop offset="100%" stop-color="#3a1f08" stop-opacity="0"/></radialGradient>
    <radialGradient id="vVignette" cx="50%" cy="50%" r="65%"><stop offset="0%" stop-color="#000" stop-opacity="0"/><stop offset="70%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.20"/></radialGradient>
    <clipPath id="clipT"><circle cx="512" cy="298" r="270"/></clipPath>
    <clipPath id="clipL"><circle cx="327" cy="619" r="270"/></clipPath>
    <clipPath id="clipR"><circle cx="697" cy="619" r="270"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="#f5f5f3"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#craftBg)" opacity="0.85"/>
  <circle cx="512" cy="298" r="270" fill="url(#ringA)"/>
  <circle cx="327" cy="619" r="270" fill="url(#ringB)"/>
  <circle cx="697" cy="619" r="270" fill="url(#ringC)"/>
  <g clip-path="url(#clipT)"><g clip-path="url(#clipL)"><rect width="1024" height="1024" fill="url(#blendAB)"/></g></g>
  <g clip-path="url(#clipT)"><g clip-path="url(#clipR)"><rect width="1024" height="1024" fill="url(#blendAC)"/></g></g>
  <g clip-path="url(#clipL)"><g clip-path="url(#clipR)"><rect width="1024" height="1024" fill="url(#blendBC)"/></g></g>
  <circle cx="512" cy="512" r="238" fill="url(#vHalo)"/>
  <g clip-path="url(#clipT)"><g clip-path="url(#clipL)"><g clip-path="url(#clipR)"><rect width="1024" height="1024" fill="url(#vLumin)"/></g></g></g>
  <circle cx="512" cy="512" r="3.5" fill="#3a1f08"/>
  <circle cx="512" cy="298" r="270" fill="none" stroke="#070707" stroke-width="2.5" stroke-opacity="0.45"/>
  <circle cx="327" cy="619" r="270" fill="none" stroke="#1b1b1b" stroke-width="2.5" stroke-opacity="0.45"/>
  <circle cx="697" cy="619" r="270" fill="none" stroke="#393939" stroke-width="2.5" stroke-opacity="0.45"/>
  <rect width="1024" height="1024" fill="url(#vVignette)"/>
