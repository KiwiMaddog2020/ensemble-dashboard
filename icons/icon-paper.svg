  <g clip-path="url(#mClipT)"><g clip-path="url(#mClipL)"><g clip-path="url(#mClipR)"><rect width="1024" height="1024" fill="url(#mLumin)"/></g></g></g>
  <circle cx="512" cy="512" r="3.5" fill="var(--mark-pin, #3a1f08)"/>
  <circle cx="512" cy="298" r="270" fill="none" stroke="var(--mark-stroke, #2c0a14)" stroke-width="2.5" stroke-opacity="0.45"/>
  <circle cx="327" cy="619" r="270" fill="none" stroke="var(--mark-stroke, #2c0a14)" stroke-width="2.5" stroke-opacity="0.45"/>
  <circle cx="697" cy="619" r="270" fill="none" stroke="var(--mark-stroke, #2c0a14)" stroke-width="2.5" stroke-opacity="0.45"/>
