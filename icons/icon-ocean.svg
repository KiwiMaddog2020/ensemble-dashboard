<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <pattern id="craftBg" x="0" y="0" width="320" height="320" patternUnits="userSpaceOnUse">
      <rect width="320" height="320" fill="#020a0d"/>
      <filter id="craft">
        <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="3"/>
        <feColorMatrix values="0 0 0 0 0.06  0 0 0 0 0.04  0 0 0 0 0.02  0 0 0 0.55 0"/>
      </filter>
      <rect width="320" height="320" filter="url(#craft)" opacity="0.30"/>
    </pattern>
    <radialGradient id="ringA" cx="35%" cy="25%" r="85%"><stop offset="0%" stop-color="#446870"/><stop offset="50%" stop-color="#063540"/><stop offset="100%" stop-color="#04252d"/></radialGradient>
    <radialGradient id="ringB" cx="35%" cy="25%" r="85%"><stop offset="0%" stop-color="#46acc5"/><stop offset="50%" stop-color="#0891b2"/><stop offset="100%" stop-color="#06667d"/></radialGradient>
    <radialGradient id="ringC" cx="35%" cy="25%" r="85%"><stop offset="0%" stop-color="#59def2"/><stop offset="50%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#1894a7"/></radialGradient>
    <radialGradient id="blendAB" cx="35%" cy="25%" r="85%"><stop offset="0%" stop-color="#398294"/><stop offset="50%" stop-color="#076379"/><stop offset="100%" stop-color="#043b49"/></radialGradient>
    <radialGradient id="blendAC" cx="35%" cy="25%" r="85%"><stop offset="0%" stop-color="#439dac"/><stop offset="50%" stop-color="#148497"/><stop offset="100%" stop-color="#0c4f5b"/></radialGradient>
    <radialGradient id="blendBC" cx="35%" cy="25%" r="85%"><stop offset="0%" stop-color="#44c1d9"/><stop offset="50%" stop-color="#15b2d0"/><stop offset="100%" stop-color="#0d6b7d"/></radialGradient>
    <radialGradient id="vLumin" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#fff5d8"/><stop offset="80%" stop-color="#f5d990"/><stop offset="100%" stop-color="#e8b860"/></radialGradient>
    <radialGradient id="vHalo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="20%" stop-color="#fff0b8" stop-opacity="0.30"/><stop offset="50%" stop-color="#f5c878" stop-opacity="0.10"/><stop offset="100%" stop-color="#c2711f" stop-opacity="0"/></radialGradient>
    <radialGradient id="vCenterField" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0891b2" stop-opacity="0.18"/><stop offset="40%" stop-color="#0891b2" stop-opacity="0.08"/><stop offset="75%" stop-color="#0891b2" stop-opacity="0.02"/><stop offset="100%" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
    <radialGradient id="vVignette" cx="50%" cy="50%" r="65%"><stop offset="0%" stop-color="#000" stop-opacity="0"/><stop offset="70%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.35"/></radialGradient>
    <clipPath id="clipT"><circle cx="512" cy="298" r="270"/></clipPath>
    <clipPath id="clipL"><circle cx="327" cy="619" r="270"/></clipPath>
    <clipPath id="clipR"><circle cx="697" cy="619" r="270"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="#020a0d"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#craftBg)" opacity="0.85"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#vCenterField)"/>
  <circle cx="512" cy="298" r="270" fill="url(#ringA)"/>
  <circle cx="327" cy="619" r="270" fill="url(#ringB)"/>
  <circle cx="697" cy="619" r="270" fill="url(#ringC)"/>
  <g clip-path="url(#clipT)"><g clip-path="url(#clipL)"><rect width="1024" height="1024" fill="url(#blendAB)"/></g></g>
  <g clip-path="url(#clipT)"><g clip-path="url(#clipR)"><rect width="1024" height="1024" fill="url(#blendAC)"/></g></g>
  <g clip-path="url(#clipL)"><g clip-path="url(#clipR)"><rect width="1024" height="1024" fill="url(#blendBC)"/></g></g>
  <circle cx="512" cy="512" r="238" fill="url(#vHalo)"/>
  <g clip-path="url(#clipT)"><g clip-path="url(#clipL)"><g clip-path="url(#clipR)"><rect width="1024" height="1024" fill="url(#vLumin)"/></g></g></g>
  <circle cx="512" cy="512" r="3.5" fill="#ffffff"/>
  <circle cx="512" cy="298" r="270" fill="none" stroke="#04252d" stroke-width="2.5" stroke-opacity="0.45"/>
  <circle cx="327" cy="619" r="270" fill="none" stroke="#06667d" stroke-width="2.5" stroke-opacity="0.45"/>
  <circle cx="697" cy="619" r="270" fill="none" stroke="#1894a7" stroke-width="2.5" stroke-opacity="0.45"/>
  <rect width="1024" height="1024" fill="url(#vVignette)"/>
</svg>
