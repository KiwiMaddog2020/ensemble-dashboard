<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1a1308"/>
      <stop offset="55%" stop-color="#100c06"/>
      <stop offset="100%" stop-color="#080503"/>
    </linearGradient>
    <linearGradient id="bronzeWave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8932e"/>
      <stop offset="50%" stop-color="#c2711f"/>
      <stop offset="100%" stop-color="#7e3f0c"/>
    </linearGradient>
    <linearGradient id="bronzeBaton" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd9a8"/>
      <stop offset="40%" stop-color="#f0b06c"/>
      <stop offset="75%" stop-color="#c87018"/>
      <stop offset="100%" stop-color="#8a4612"/>
    </linearGradient>
    <linearGradient id="bronzeBatonTopFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0d4"/>
      <stop offset="100%" stop-color="#f4be7e"/>
    </linearGradient>
    <linearGradient id="cork" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3210"/>
      <stop offset="55%" stop-color="#3a1d08"/>
      <stop offset="100%" stop-color="#1c0f04"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="78%">
      <stop offset="0%" stop-color="#e08a2c" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#e08a2c" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="batonShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.60"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#topGlow)"/>
  <rect x="26" y="26" width="972" height="972" rx="208" ry="208"
