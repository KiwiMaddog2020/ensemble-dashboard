  </g>
  <g transform="rotate(-28 512 512)" filter="url(#batonShadow)">
    <circle cx="215" cy="512" r="24" fill="#160a02" stroke="#c2711f" stroke-width="1.8"/>
    <circle cx="211" cy="506" r="6" fill="#3a1d08"/>
    <rect x="222" y="484" width="100" height="56" rx="7" fill="url(#cork)"/>
    <rect x="322" y="484" width="12" height="56" rx="2" fill="url(#bronzeBaton)"/>
    <rect x="322" y="484" width="12" height="6" fill="#ffe6b8" opacity="0.7"/>
    <path d="M 334 503 L 796 506 L 796 518 L 334 521 Z" fill="url(#bronzeBaton)"/>
    <path d="M 336 503 L 794 506 L 794 508 L 336 505 Z" fill="url(#bronzeBatonTopFace)" opacity="0.85"/>
    <circle cx="802" cy="512" r="9" fill="#f4c084"/>
    <circle cx="800" cy="509" r="3" fill="#fff0d4"/>
