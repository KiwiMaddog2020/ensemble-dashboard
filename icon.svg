<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Ensemble brand mark — "Threaded Trinity, Painted" (v10v, locked 2026-04-29).

    Meaning: "Two voices make a new pigment.  Three voices make light."

    Three filled disks (burgundy / ochre / navy) in a true equilateral
    arrangement, centroid at canvas center.  Where two rings meet, their
    pigments mix into the natural color-theory primary blend (carmine /
    plum / verdigris).  Where all three meet at the very center, a
    luminous white-gold core — the additive answer to the subtractive
    blends, the "ensemble" born from all three voices together.

    Heraldic palette (Gules / Or / Azure) used since the 12th century.
    Color theory: subtractive pigment mixing for pairs, additive light
    for the trinity.  Sacred-geometry: equilateral, centered, with a
    signature pin-prick at the exact canvas centroid (512, 512) inside
    the luminous core — the soul-spark, our trademark distinguishing
    detail.

    See docs/TRADEMARK_CLEARANCE.md for the brand color system spec.

    Iteration: v10a-h refined Borromean threading, v10i-l explored
    threading polish + math precision, v10m-n tried clean overlap +
    masked threading, v10o-r locked the filled-Venn artist-palette
    direction with calibrated rich-dark blends + glowing white core +
    fractal experiments, v10s-t tuned the bigger center + dual-mode +
    white-in-both-modes, v10u shifted Carmine more red, v10v added the
    signature centroid pin-prick + warmer navy for palette cohesion.
  -->
  <defs>
    <pattern id="craftBg" x="0" y="0" width="320" height="320" patternUnits="userSpaceOnUse">
      <rect width="320" height="320" fill="#0e0a06"/>
      <filter id="craft">
        <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="3"/>
        <feColorMatrix values="0 0 0 0 0.06  0 0 0 0 0.04  0 0 0 0 0.02  0 0 0 0.55 0"/>
      </filter>
      <rect width="320" height="320" filter="url(#craft)" opacity="0.30"/>
    </pattern>
    <radialGradient id="vBurg" cx="35%" cy="25%" r="85%"><stop offset="0%" stop-color="#b04a55"/><stop offset="50%" stop-color="#6b1f2c"/><stop offset="100%" stop-color="#2c0a14"/></radialGradient>
    <radialGradient id="vOchre" cx="35%" cy="25%" r="85%"><stop offset="0%" stop-color="#e8a050"/><stop offset="50%" stop-color="#c2711f"/><stop offset="100%" stop-color="#7a3d0c"/></radialGradient>
    <radialGradient id="vNavy" cx="35%" cy="25%" r="85%"><stop offset="0%" stop-color="#5763a8"/><stop offset="50%" stop-color="#1f2865"/><stop offset="100%" stop-color="#0a0e2c"/></radialGradient>
    <radialGradient id="vCarmine" cx="35%" cy="25%" r="85%"><stop offset="0%" stop-color="#BE6044"/><stop offset="50%" stop-color="#7F3820"/><stop offset="100%" stop-color="#34170D"/></radialGradient>
    <radialGradient id="vPlum" cx="35%" cy="25%" r="85%"><stop offset="0%" stop-color="#6b3a8a"/><stop offset="50%" stop-color="#401a5e"/><stop offset="100%" stop-color="#18062a"/></radialGradient>
    <radialGradient id="vVerd" cx="35%" cy="25%" r="85%"><stop offset="0%" stop-color="#4e7848"/><stop offset="50%" stop-color="#294a26"/><stop offset="100%" stop-color="#0a1a0a"/></radialGradient>
    <radialGradient id="vLumin" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#fff5d8"/><stop offset="80%" stop-color="#f5d990"/><stop offset="100%" stop-color="#e8b860"/></radialGradient>
    <radialGradient id="vHalo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="20%" stop-color="#fff0b8" stop-opacity="0.30"/><stop offset="50%" stop-color="#f5c878" stop-opacity="0.10"/><stop offset="100%" stop-color="#c2711f" stop-opacity="0"/></radialGradient>
    <radialGradient id="vCenterField" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#c2711f" stop-opacity="0.18"/><stop offset="40%" stop-color="#c2711f" stop-opacity="0.08"/><stop offset="75%" stop-color="#c2711f" stop-opacity="0.02"/><stop offset="100%" stop-color="#c2711f" stop-opacity="0"/></radialGradient>
    <radialGradient id="vVignette" cx="50%" cy="50%" r="65%"><stop offset="0%" stop-color="#000" stop-opacity="0"/><stop offset="70%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.35"/></radialGradient>
    <clipPath id="clipT"><circle cx="512" cy="331" r="226"/></clipPath>
    <clipPath id="clipL"><circle cx="355" cy="602" r="226"/></clipPath>
    <clipPath id="clipR"><circle cx="669" cy="602" r="226"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" fill="#0e0a06"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#craftBg)" opacity="0.85"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#vCenterField)"/>

  <!-- Containing frame circle, ochre, complete -->
  <circle cx="512" cy="512" r="478" fill="none" stroke="#c2711f" stroke-width="2.4" stroke-opacity="0.82"/>

  <!-- Three base disks (filled with metallic-radial gradient, equilateral, r=226) -->
  <circle cx="355" cy="602" r="226" fill="url(#vOchre)"/>
  <circle cx="669" cy="602" r="226" fill="url(#vNavy)"/>
  <circle cx="512" cy="331" r="226" fill="url(#vBurg)"/>

  <!-- Pairwise blend lenses (computed-color subtractive mixes) -->
  <g clip-path="url(#clipT)"><g clip-path="url(#clipL)"><rect width="1024" height="1024" fill="url(#vCarmine)"/></g></g>
  <g clip-path="url(#clipT)"><g clip-path="url(#clipR)"><rect width="1024" height="1024" fill="url(#vPlum)"/></g></g>
  <g clip-path="url(#clipL)"><g clip-path="url(#clipR)"><rect width="1024" height="1024" fill="url(#vVerd)"/></g></g>

  <!-- Halo behind triple intersection — bleeds into surrounding lenses -->
  <circle cx="512" cy="512" r="200" fill="url(#vHalo)"/>

  <!-- Triple intersection: luminous white-gold (additive light at the center) -->
  <g clip-path="url(#clipT)"><g clip-path="url(#clipL)"><g clip-path="url(#clipR)"><rect width="1024" height="1024" fill="url(#vLumin)"/></g></g></g>

  <!-- SIGNATURE: pure-white pin-prick at exact canvas centroid -->
  <circle cx="512" cy="512" r="3.5" fill="#ffffff"/>

  <!-- Inked edges per ring (deep-shadow color of each parent) -->
  <circle cx="355" cy="602" r="226" fill="none" stroke="#7a3d0c" stroke-width="2.5" stroke-opacity="0.45"/>
  <circle cx="669" cy="602" r="226" fill="none" stroke="#0a0e2c" stroke-width="2.5" stroke-opacity="0.45"/>
  <circle cx="512" cy="331" r="226" fill="none" stroke="#2c0a14" stroke-width="2.5" stroke-opacity="0.45"/>

  <!-- Outer vignette for focus -->
  <rect width="1024" height="1024" fill="url(#vVignette)"/>
</svg>
