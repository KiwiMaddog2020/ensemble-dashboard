<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Ensemble brand mark — "The Ensemble Field" (v9, locked 2026-04-27 evening).

    Meaning: "Linked by each other.  Each carries the others.  Inseparable."

    Six rings in a 6-fold symmetric mandala.  Three core rings form a
    threaded Borromean knot (full opacity, cyclic over-under threading);
    three mid rings sit at complementary positions (25% opacity), creating
    an atmospheric field of voices that extends the ensemble beyond the
    visible knot.

    Sacred-geometry / mathematical heritage: combines flower-of-life
    (6 rings around center) with Trinity-knot threading.  Two ancient
    traditions layered.  Inked-workshop aesthetic (flat-ink rings on
    paper-textured dark background, single thin frame with one tiny
    imperfection).
  -->
  <defs>
    <pattern id="craftBg" x="0" y="0" width="320" height="320" patternUnits="userSpaceOnUse">
      <rect width="320" height="320" fill="#0e0a06"/>
      <filter id="craft">
        <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="3"/>
        <feColorMatrix values="0 0 0 0 0.06  0 0 0 0 0.04  0 0 0 0 0.02  0 0 0 0.55 0"/>
      </filter>
      <rect width="320" height="320" filter="url(#craft)" opacity="0.30"/>
    </pattern>
    <radialGradient id="ringMetal" cx="35%" cy="25%" r="85%">
      <stop offset="0%"   stop-color="#e8a050"/>
      <stop offset="50%"  stop-color="#c2711f"/>
      <stop offset="100%" stop-color="#7a3d0c"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="#0e0a06"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#craftBg)" opacity="0.85"/>
  <!-- Frame with 4° gap at upper-right (signature imperfection) -->
  <path d="M 990 512 A 478 478 0 0 1 940 740 M 902 802 A 478 478 0 1 1 990 506"
        fill="none" stroke="#c2711f" stroke-width="2.2" stroke-opacity="0.78"/>
  <!-- MID TIER (atmospheric backdrop, 25% opacity, no threading) -->
  <g opacity="0.25">
    <circle cx="754" cy="372" r="180" fill="none" stroke="#c2711f" stroke-width="16"/>
    <circle cx="270" cy="372" r="180" fill="none" stroke="#c2711f" stroke-width="16"/>
    <circle cx="512" cy="792" r="180" fill="none" stroke="#c2711f" stroke-width="16"/>
  </g>
  <!-- CORE TIER (threaded Borromean knot, full opacity, +6 lift on top ring) -->
  <circle cx="358" cy="601" r="220" fill="none" stroke="url(#ringMetal)" stroke-width="18"/>
  <circle cx="666" cy="601" r="220" fill="none" stroke="url(#ringMetal)" stroke-width="18"/>
  <circle cx="512" cy="328" r="220" fill="none" stroke="url(#ringMetal)" stroke-width="18"/>
  <!-- THREADING BLADES (cyclic: top-over-left, left-over-right, right-over-top) -->
  <line x1="291.0" y1="365.0" x2="304.0" y2="412.0" stroke="#0e0a06" stroke-width="28" stroke-linecap="round"/>
  <line x1="589.0" y1="540.0" x2="554.0" y2="552.0" stroke="#0e0a06" stroke-width="28" stroke-linecap="round"/>
  <line x1="499.0" y1="430.0" x2="525.0" y2="458.0" stroke="#0e0a06" stroke-width="28" stroke-linecap="round"/>
  <line x1="525.0" y1="744.0" x2="499.0" y2="772.0" stroke="#0e0a06" stroke-width="28" stroke-linecap="round"/>
  <line x1="445.0" y1="526.0" x2="460.0" y2="566.0" stroke="#0e0a06" stroke-width="28" stroke-linecap="round"/>
  <line x1="743.0" y1="396.0" x2="707.0" y2="382.0" stroke="#0e0a06" stroke-width="28" stroke-linecap="round"/>
</svg>
