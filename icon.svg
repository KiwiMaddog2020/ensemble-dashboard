<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Ensemble brand mark — "Threaded Trinity" (v10i, locked 2026-04-28).

    Meaning: "Linked by each other.  Each carries the others.  Inseparable."

    v10 builds on v9's threaded Borromean knot but adds two layers of
    visual richness:

      1. Three rings, each in its own ink — the Heraldic Trinity palette
         (burgundy / gold leaf / deep navy).  This is the classical
         royal palette: Gules + Or + Azure are three of the five primary
         heraldic tinctures, the combination found on French royal arms,
         Burgundian arms, papal regalia, and illuminated manuscripts
         from Carolingian onward.  Aging-gracefully bar passes by 800+
         years of precedent.

         Each color carries weight:
            burgundy (top)       — wine, flame, the bloodline, the voice
            gold leaf (lower-L)  — sun, illumination, the patron's gift
            deep navy (lower-R)  — night sky, the deep, the contemplative

         Each ring keeps the v9 metallic-radial-gradient depth (light
         highlight upper-left, deep shadow lower-right) so the rings
         read as inked-metal at any scale.

         Iteration history:
           v10a — Inked Workshop (sanguine/sienna/sepia, all warm earth)
                  Sepia read as background-near, faded at small sizes.
           v10b — same palette, thicker rings + bumped rosette opacity.
           v10c — Three Royal Inks (crimson/gold/lapis): red+yellow+blue
                  primaries, Renaissance illuminated-manuscript style.
                  Crimson read too bright; lapis read more medium-blue.
           v10d — Heraldic Trinity (burgundy/gold/navy): the canonical
                  royal-formal palette.  Burgundy is wine-darker than
                  crimson; navy is night-darker than lapis.  Gold was
                  shifted yellower (#c0881a mid) but Kevin preferred
                  the "orange-yellow that looked very golden."
           v10e — same Heraldic Trinity, gold reverted to the v10c
                  amber-orange (#b8821c mid).  More candle-glow than
                  pure-gold-leaf.  Still read as too yellow.
           v10f — gold-position swapped to v9's signature warm orange
                  ochre (#e8a050 → #c2711f → #7a3d0c).  Renamed
                  inkGold → inkOchre for accuracy.
           v10g — frame + rosette switched from ochre to white.  White
                  pen-stroke on dark vellum reads as illuminated-
                  manuscript ground.  Rosette stroke bumped 2.6 → 3.4
                  for more presence.
           v10h — rosette stays white; FRAME reverts to ochre + becomes
                  unbroken (gap closed).  Self-rated 7-8.5/10 depending
                  on weighting.  Real weaknesses: rosette muddy at
                  small sizes, dark-bg-only design, busy at favicon.
           v10i — DROP THE ROSETTE.  Replace with subtle warm radial
                  glow at center — atmospheric "field" rather than
                  countable element.  Three layers now: trinity (rings)
                  + frame (containing circle) + warm glow (the field
                  they live in).  Sleeker, scales cleanly, brief is
                  "collectiveness of individuals" at the silhouette
                  level — Borromean structure carries it without
                  ornament.  Threading blades unchanged (they work).
                  Locked.

      2. A faint flower-of-life rosette behind the rings (~12% opacity,
         single pen-stroke).  Not ornament-for-ornament's-sake — it's
         the sacred-geometry FIELD that the rings live within, the
         atmospheric background a master draftsman would lay down before
         inking the figure.  Composed in ochre to harmonize with the
         frame and cream textured paper.

    Sacred-geometry / mathematical heritage: still the threaded Borromean
    knot at full opacity (no compromise on the structural identity), but
    now resting in the flower-of-life field that the threading was always
    drawn from.  v9 was the figure; v10 is figure + ground.

    Apple-quality discipline: 3 colors, 1 palette family, no random
    primaries.  Ornament is below the silhouette in the visual hierarchy.
    Master mark first; themed variants will inherit the same structure
    via theme_icons.py once this is locked.
  -->
  <defs>
    <pattern id="craftBg" x="0" y="0" width="320" height="320" patternUnits="userSpaceOnUse">
      <rect width="320" height="320" fill="#0e0a06"/>
      <filter id="craft">
        <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="3"/>
        <feColorMatrix values="0 0 0 0 0.06  0 0 0 0 0.04  0 0 0 0 0.02  0 0 0 0.55 0"/>
      </filter>
      <rect width="320" height="320" filter="url(#craft)" opacity="0.30"/>
    </pattern>
    <!-- Heraldic Trinity ring gradients (highlight → mid → shadow).
         Gules + Or + Azure: the canonical royal-formal palette.  Each
         ring keeps the v9 metallic-radial illusion in its own ink.
         Highlight stops are tuned to similar luminosity (~50-60%) so
         no single ring visually dominates — three equal voices. -->
    <radialGradient id="inkBurgundy" cx="35%" cy="25%" r="85%">
      <stop offset="0%"   stop-color="#b04a55"/>
      <stop offset="50%"  stop-color="#6b1f2c"/>
      <stop offset="100%" stop-color="#2c0a14"/>
    </radialGradient>
    <radialGradient id="inkOchre" cx="35%" cy="25%" r="85%">
      <stop offset="0%"   stop-color="#e8a050"/>
      <stop offset="50%"  stop-color="#c2711f"/>
      <stop offset="100%" stop-color="#7a3d0c"/>
    </radialGradient>
    <radialGradient id="inkNavy" cx="35%" cy="25%" r="85%">
      <stop offset="0%"   stop-color="#5066b8"/>
      <stop offset="50%"  stop-color="#1c2a72"/>
      <stop offset="100%" stop-color="#08123a"/>
    </radialGradient>
    <!-- Warm centerfield glow.  Ambient ground for the trinity, NOT a
         countable element.  Wraps the Borromean centroid (~512, 510)
         in a soft amber halo that fades to fully transparent before
         reaching the frame — "the field they live in." -->
    <radialGradient id="centerField" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c2711f" stop-opacity="0.22"/>
      <stop offset="40%"  stop-color="#c2711f" stop-opacity="0.10"/>
      <stop offset="75%"  stop-color="#c2711f" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#c2711f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="#0e0a06"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#craftBg)" opacity="0.85"/>
  <!-- Warm centerfield glow.  v10i replaced the v10h rosette with
       this radial gradient — atmospheric, not ornamental.  The trinity
       reads as living in a warm amber field, dimming gracefully toward
       the frame.  Pure luminance, no countable strokes. -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#centerField)"/>
  <!-- Containing frame circle, ochre, complete (no gap).
       v10h: removed the 4° upper-right gap — Kevin's read was that it
       looked broken rather than intentional. -->
  <circle cx="512" cy="512" r="478"
          fill="none" stroke="#c2711f" stroke-width="2.4" stroke-opacity="0.82"/>
  <!-- Three rings, threaded Borromean knot, each in its own royal ink.
       Top ring   = burgundy (wine, flame, the bloodline, the voice)
       Lower-left = ochre    (copper-terracotta — sun, illumination, warmth)
       Lower-right= navy     (Azure — night sky, the deep, contemplation)
       Stroke 34px reads at favicon / nav scales. -->
  <circle cx="358" cy="601" r="220" fill="none" stroke="url(#inkOchre)"    stroke-width="34"/>
  <circle cx="666" cy="601" r="220" fill="none" stroke="url(#inkNavy)"     stroke-width="34"/>
  <circle cx="512" cy="328" r="220" fill="none" stroke="url(#inkBurgundy)" stroke-width="34"/>
  <!-- THREADING BLADES (cyclic: top-over-left, left-over-right,
       right-over-top).  Width 38 punches through any ring color.
       Stroke = bg color so the cuts visually disappear into the paper. -->
  <line x1="291.0" y1="365.0" x2="304.0" y2="412.0" stroke="#0e0a06" stroke-width="42" stroke-linecap="round"/>
  <line x1="589.0" y1="540.0" x2="554.0" y2="552.0" stroke="#0e0a06" stroke-width="42" stroke-linecap="round"/>
  <line x1="499.0" y1="430.0" x2="525.0" y2="458.0" stroke="#0e0a06" stroke-width="42" stroke-linecap="round"/>
  <line x1="525.0" y1="744.0" x2="499.0" y2="772.0" stroke="#0e0a06" stroke-width="42" stroke-linecap="round"/>
  <line x1="445.0" y1="526.0" x2="460.0" y2="566.0" stroke="#0e0a06" stroke-width="42" stroke-linecap="round"/>
  <line x1="743.0" y1="396.0" x2="707.0" y2="382.0" stroke="#0e0a06" stroke-width="42" stroke-linecap="round"/>
</svg>
