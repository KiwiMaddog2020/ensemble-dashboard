<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" width="32" height="48" shape-rendering="crispEdges" data-sprite-id="musician_violin" data-tags="music,violin,strings,musician,person">
  <!-- Hair -->
  <rect x="10" y="3" width="11" height="3" fill="#5c3318"/>
  <!-- Face -->
  <rect x="11" y="6" width="10" height="6" fill="#f3c498"/>
  <rect x="13" y="8" width="2" height="1" fill="#18150f"/>
  <rect x="17" y="8" width="2" height="1" fill="#18150f"/>
  <rect x="14" y="10" width="4" height="1" fill="#c2711f" opacity="0.5"/>
  <!-- Neck -->
  <rect x="13" y="12" width="6" height="1" fill="#f3c498"/>
  <!-- Shirt -->
  <rect x="10" y="13" width="12" height="14" fill="var(--accent-3, #f3c07a)"/>
  <rect x="11" y="14" width="10" height="1" fill="var(--accent-2, #e08a2c)" opacity="0.4"/>
  <!-- Pants -->
  <rect x="10" y="27" width="12" height="14" fill="#1a0d02"/>
  <rect x="10" y="29" width="5" height="12" fill="#1a0d02"/>
  <rect x="17" y="29" width="5" height="12" fill="#1a0d02"/>
  <!-- Violin body (chin held) -->
  <rect x="2" y="11" width="2" height="6" fill="#7e3f0c"/>
  <rect x="4" y="9" width="6" height="10" fill="#a85c1a"/>
  <rect x="5" y="10" width="4" height="8" fill="#c87018"/>
  <rect x="6" y="11" width="2" height="1" fill="#18150f"/>
  <rect x="6" y="14" width="2" height="1" fill="#18150f"/>
  <!-- Violin neck -->
  <rect x="10" y="13" width="3" height="1" fill="#7e3f0c"/>
  <!-- Bow -->
  <rect x="2" y="20" width="14" height="1" fill="#c8a070"/>
  <rect x="2" y="21" width="14" height="1" fill="#3a1f04" opacity="0.6"/>
  <!-- Right arm holding bow -->
  <rect x="14" y="17" width="2" height="5" fill="var(--accent-3, #f3c07a)"/>
  <rect x="13" y="20" width="2" height="2" fill="#f3c498"/>
  <!-- Left arm under violin -->
  <rect x="8" y="13" width="3" height="6" fill="var(--accent-3, #f3c07a)"/>
  <rect x="6" y="17" width="3" height="2" fill="#f3c498"/>
  <!-- Shoes -->
  <rect x="10" y="41" width="5" height="2" fill="#1a0d02"/>
  <rect x="17" y="41" width="5" height="2" fill="#1a0d02"/>
</svg>
