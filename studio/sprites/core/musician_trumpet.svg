<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" width="32" height="48" shape-rendering="crispEdges" data-sprite-id="musician_trumpet" data-tags="music,trumpet,brass,musician,person">
  <!-- Hair -->
  <rect x="10" y="3" width="11" height="3" fill="#5c3318"/>
  <!-- Face -->
  <rect x="11" y="6" width="10" height="6" fill="#f3c498"/>
  <rect x="13" y="8" width="2" height="1" fill="#18150f"/>
  <rect x="17" y="8" width="2" height="1" fill="#18150f"/>
  <rect x="14" y="10" width="4" height="1" fill="#c2711f" opacity="0.5"/>
  <!-- Cheeks (puffed for trumpet) -->
  <rect x="9" y="9" width="2" height="3" fill="#e8b07a"/>
  <rect x="21" y="9" width="2" height="3" fill="#e8b07a"/>
  <!-- Neck -->
  <rect x="13" y="12" width="6" height="1" fill="#f3c498"/>
  <!-- Shirt -->
  <rect x="10" y="13" width="12" height="14" fill="var(--accent-3, #f3c07a)"/>
  <rect x="14" y="14" width="4" height="2" fill="#0f0d0a" opacity="0.4"/>
  <!-- Pants -->
  <rect x="10" y="27" width="12" height="13" fill="#1a0d02"/>
  <!-- Trumpet (gold, raised) -->
  <rect x="20" y="9" width="9" height="3" fill="#e8c060"/>
  <rect x="20" y="9" width="9" height="1" fill="#fff0a0"/>
  <rect x="20" y="11" width="9" height="1" fill="#a8801a"/>
  <!-- Bell flare -->
  <rect x="29" y="8" width="2" height="5" fill="#e8c060"/>
  <rect x="31" y="7" width="1" height="7" fill="#e8c060"/>
  <!-- Valve casings -->
  <rect x="22" y="7" width="1" height="2" fill="#e8c060"/>
  <rect x="24" y="7" width="1" height="2" fill="#e8c060"/>
  <rect x="26" y="7" width="1" height="2" fill="#e8c060"/>
  <!-- Mouthpiece -->
  <rect x="19" y="10" width="1" height="1" fill="#fff0a0"/>
  <!-- Right arm holding trumpet -->
  <rect x="20" y="13" width="2" height="6" fill="var(--accent-3, #f3c07a)"/>
  <rect x="20" y="11" width="2" height="2" fill="#f3c498"/>
  <!-- Left arm holding trumpet (under) -->
  <rect x="22" y="14" width="2" height="5" fill="var(--accent-3, #f3c07a)"/>
  <!-- Shoes -->
  <rect x="10" y="40" width="5" height="2" fill="#1a0d02"/>
  <rect x="17" y="40" width="5" height="2" fill="#1a0d02"/>
</svg>
