  <rect x="20" y="11" width="11" height="1" fill="#d4d4d4"/>
  <rect x="20" y="12" width="11" height="1" fill="#a8a8a8"/>
  <rect x="22" y="11" width="1" height="2" fill="#5a5a5a"/>
  <rect x="25" y="11" width="1" height="2" fill="#5a5a5a"/>
  <rect x="28" y="11" width="1" height="2" fill="#5a5a5a"/>
  <rect x="19" y="11" width="1" height="2" fill="#3a3a3a"/>
  <!-- Right arm holding far end of flute -->
  <rect x="22" y="13" width="2" height="6" fill="var(--accent-3, #f3c07a)"/>
  <rect x="22" y="11" width="2" height="2" fill="#f3c498"/>
  <!-- Left arm -->
  <rect x="20" y="14" width="2" height="6" fill="var(--accent-3, #f3c07a)"/>
  <rect x="20" y="11" width="2" height="3" fill="#f3c498"/>
  <!-- Shoes -->
