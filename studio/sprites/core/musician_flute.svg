<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" width="32" height="48" shape-rendering="crispEdges" data-sprite-id="musician_flute" data-tags="music,flute,woodwind,musician,person">
  <!-- Hair -->
  <rect x="10" y="3" width="11" height="3" fill="#c8a070"/>
  <rect x="9" y="5" width="13" height="2" fill="#c8a070"/>
  <!-- Face -->
  <rect x="11" y="7" width="10" height="6" fill="#f3c498"/>
  <rect x="13" y="9" width="2" height="1" fill="#18150f"/>
  <rect x="17" y="9" width="2" height="1" fill="#18150f"/>
  <rect x="14" y="11" width="4" height="1" fill="#c2711f" opacity="0.5"/>
  <!-- Neck -->
  <rect x="13" y="13" width="6" height="1" fill="#f3c498"/>
  <!-- Shirt -->
  <rect x="10" y="14" width="12" height="14" fill="var(--accent-3, #f3c07a)"/>
  <rect x="14" y="15" width="4" height="2" fill="#0f0d0a" opacity="0.4"/>
  <!-- Pants -->
