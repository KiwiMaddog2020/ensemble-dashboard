<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 48" width="40" height="48" shape-rendering="crispEdges" data-sprite-id="arcade_racing" data-tags="game,arcade,racing,sit-down,interactive">
  <!-- Screen housing -->
  <rect x="6" y="4" width="28" height="14" fill="#1a0d02"/>
  <rect x="8" y="6" width="24" height="10" fill="#0a1428"/>
  <!-- Racing scene on screen -->
  <rect x="9" y="7" width="22" height="3" fill="#3b82f6"/>
  <rect x="9" y="10" width="22" height="5" fill="#22c55e"/>
  <rect x="14" y="10" width="12" height="5" fill="#0f0d0a"/>
  <rect x="15" y="10" width="2" height="5" fill="#ffffff" opacity="0.4"/>
  <rect x="23" y="10" width="2" height="5" fill="#ffffff" opacity="0.4"/>
  <!-- Car on track -->
  <rect x="18" y="13" width="4" height="2" fill="#ef4444"/>
  <rect x="18" y="12" width="4" height="1" fill="#fca5a5"/>
  <!-- Top edge -->
  <rect x="5" y="3" width="30" height="2" fill="#0f0d0a"/>
  <rect x="5" y="18" width="30" height="2" fill="#0f0d0a"/>
  <!-- Steering wheel area -->
  <rect x="14" y="20" width="12" height="10" fill="#1a0d02"/>
  <rect x="15" y="21" width="10" height="8" fill="#3a1f04"/>
  <!-- Steering wheel -->
  <rect x="17" y="22" width="6" height="6" fill="#0f0d0a"/>
  <rect x="18" y="23" width="4" height="4" fill="#1a0d02"/>
  <rect x="19" y="24" width="2" height="2" fill="var(--accent, #c2711f)"/>
  <!-- Pedals + base -->
  <rect x="10" y="30" width="20" height="6" fill="#0f0d0a"/>
  <rect x="11" y="31" width="18" height="5" fill="#1a0d02"/>
  <!-- Seat (extends below) -->
  <rect x="8" y="36" width="24" height="6" fill="#5c3318"/>
  <rect x="9" y="37" width="22" height="5" fill="#7e4a18"/>
  <!-- Seat detail -->
  <rect x="14" y="38" width="12" height="3" fill="#5c3318"/>
  <!-- Base -->
  <rect x="6" y="42" width="28" height="3" fill="#0a0805"/>
  <rect x="4" y="45" width="32" height="3" fill="#000000"/>
</svg>
