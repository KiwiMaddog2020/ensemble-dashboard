<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" width="32" height="48" shape-rendering="crispEdges" data-sprite-id="arcade_claw" data-tags="game,claw,prize,arcade,interactive">
  <!-- Top sign -->
  <rect x="6" y="2" width="20" height="4" fill="var(--accent, #c2711f)"/>
  <rect x="7" y="3" width="18" height="2" fill="var(--accent-2, #f3c07a)"/>
  <!-- Top frame -->
  <rect x="4" y="6" width="24" height="2" fill="#0f0d0a"/>
  <!-- Glass cabinet (4 sides) -->
  <rect x="4" y="8" width="2" height="22" fill="#0f0d0a"/>
  <rect x="26" y="8" width="2" height="22" fill="#0f0d0a"/>
  <rect x="4" y="28" width="24" height="2" fill="#0f0d0a"/>
  <!-- Glass interior (slight tint) -->
  <rect x="6" y="8" width="20" height="20" fill="#1a2030" opacity="0.3"/>
  <!-- Claw track (rail at top) -->
  <rect x="6" y="9" width="20" height="1" fill="#3a3a3a"/>
  <!-- Claw mechanism -->
  <rect x="14" y="10" width="4" height="2" fill="#3a3a3a"/>
  <rect x="15" y="12" width="2" height="3" fill="#5a5a5a"/>
  <!-- Claw arms -->
  <rect x="13" y="15" width="1" height="3" fill="#a8a8a8"/>
  <rect x="18" y="15" width="1" height="3" fill="#a8a8a8"/>
  <rect x="13" y="18" width="2" height="1" fill="#a8a8a8"/>
  <rect x="17" y="18" width="2" height="1" fill="#a8a8a8"/>
  <!-- Plushies in the cabinet -->
  <rect x="7" y="22" width="3" height="4" fill="#ef4444"/>
  <rect x="8" y="21" width="1" height="1" fill="#ef4444"/>
  <rect x="7" y="22" width="1" height="1" fill="#ffffff"/>
  <rect x="11" y="23" width="3" height="3" fill="#fbbf24"/>
  <rect x="12" y="22" width="1" height="1" fill="#fbbf24"/>
  <rect x="15" y="22" width="3" height="4" fill="#a78bfa"/>
  <rect x="16" y="21" width="1" height="1" fill="#a78bfa"/>
  <rect x="20" y="23" width="3" height="3" fill="#22c55e"/>
  <rect x="21" y="22" width="1" height="1" fill="#22c55e"/>
  <rect x="23" y="22" width="3" height="4" fill="#3b82f6"/>
  <rect x="24" y="21" width="1" height="1" fill="#3b82f6"/>
  <!-- Coin slot + button area -->
  <rect x="4" y="30" width="24" height="6" fill="#0f0d0a"/>
  <rect x="5" y="31" width="22" height="4" fill="#1a0d02"/>
  <rect x="9" y="32" width="3" height="1" fill="#3a1f04"/>
  <rect x="20" y="32" width="2" height="2" fill="#ef4444"/>
  <rect x="14" y="33" width="4" height="1" fill="#fbbf24"/>
  <!-- Body -->
  <rect x="4" y="36" width="24" height="8" fill="#3a1f04"/>
  <rect x="5" y="37" width="22" height="6" fill="var(--accent, #c2711f)"/>
  <rect x="6" y="38" width="20" height="4" fill="var(--accent-2, #e08a2c)"/>
  <!-- Base -->
  <rect x="3" y="44" width="26" height="3" fill="#0a0805"/>
  <rect x="2" y="46" width="28" height="2" fill="#000000"/>
</svg>
