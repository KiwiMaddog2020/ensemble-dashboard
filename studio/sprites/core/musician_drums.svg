<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" width="32" height="48" shape-rendering="crispEdges" data-sprite-id="musician_drums" data-tags="music,drums,percussion,musician,person">
  <!-- Hair -->
  <rect x="10" y="2" width="11" height="3" fill="#3a2418"/>
  <rect x="9" y="4" width="13" height="2" fill="#3a2418"/>
  <!-- Face -->
  <rect x="11" y="6" width="10" height="6" fill="#d99a6c"/>
  <rect x="13" y="8" width="2" height="1" fill="#18150f"/>
  <rect x="17" y="8" width="2" height="1" fill="#18150f"/>
  <rect x="14" y="10" width="4" height="1" fill="#c2711f" opacity="0.5"/>
  <!-- Neck -->
  <rect x="13" y="12" width="6" height="1" fill="#d99a6c"/>
  <!-- Shirt -->
  <rect x="10" y="13" width="12" height="14" fill="var(--accent-3, #f3c07a)"/>
  <!-- Pants -->
  <rect x="10" y="27" width="12" height="13" fill="#1a0d02"/>
  <!-- Drum (timpani style — large round) -->
  <rect x="2" y="22" width="10" height="2" fill="#7e3f0c"/>
  <rect x="1" y="24" width="12" height="11" fill="#a85c1a"/>
  <rect x="2" y="35" width="10" height="2" fill="#7e3f0c"/>
  <rect x="1" y="24" width="2" height="11" fill="#7e3f0c"/>
  <rect x="11" y="24" width="2" height="11" fill="#7e3f0c"/>
  <rect x="2" y="22" width="10" height="2" fill="#e8c69a"/>
  <!-- Drum sticks -->
  <rect x="9" y="14" width="1" height="6" fill="#d4a060"/>
  <rect x="8" y="20" width="1" height="2" fill="#d4a060"/>
  <rect x="14" y="14" width="1" height="6" fill="#d4a060"/>
  <rect x="13" y="20" width="1" height="2" fill="#d4a060"/>
  <!-- Arms -->
  <rect x="8" y="14" width="2" height="6" fill="var(--accent-3, #f3c07a)"/>
  <rect x="22" y="14" width="2" height="8" fill="var(--accent-3, #f3c07a)"/>
  <rect x="22" y="22" width="2" height="2" fill="#d99a6c"/>
  <!-- Shoes -->
  <rect x="10" y="40" width="5" height="2" fill="#1a0d02"/>
  <rect x="17" y="40" width="5" height="2" fill="#1a0d02"/>
