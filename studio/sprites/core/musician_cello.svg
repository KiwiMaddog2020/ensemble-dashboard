<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" width="32" height="48" shape-rendering="crispEdges" data-sprite-id="musician_cello" data-tags="music,cello,strings,musician,person,seated">
  <!-- Hair -->
  <rect x="11" y="2" width="9" height="3" fill="#1a0d02"/>
  <rect x="10" y="4" width="11" height="2" fill="#1a0d02"/>
  <!-- Face -->
  <rect x="11" y="6" width="10" height="6" fill="#e8b288"/>
  <rect x="13" y="8" width="2" height="1" fill="#18150f"/>
  <rect x="17" y="8" width="2" height="1" fill="#18150f"/>
  <rect x="14" y="10" width="4" height="1" fill="#c2711f" opacity="0.5"/>
  <!-- Neck -->
  <rect x="13" y="12" width="6" height="1" fill="#e8b288"/>
  <!-- Shirt (seated, knees up) -->
  <rect x="9" y="13" width="14" height="11" fill="var(--accent-3, #f3c07a)"/>
  <rect x="14" y="14" width="4" height="2" fill="#0f0d0a" opacity="0.4"/>
  <!-- Cello body (between legs, large) -->
  <rect x="13" y="19" width="6" height="2" fill="#7e3f0c"/>
  <rect x="11" y="21" width="10" height="14" fill="#a85c1a"/>
  <rect x="12" y="22" width="8" height="12" fill="#c87018"/>
  <rect x="13" y="24" width="2" height="1" fill="#18150f"/>
  <rect x="17" y="24" width="2" height="1" fill="#18150f"/>
  <rect x="13" y="29" width="2" height="1" fill="#18150f"/>
  <rect x="17" y="29" width="2" height="1" fill="#18150f"/>
  <!-- Endpin -->
  <rect x="15" y="35" width="2" height="3" fill="#3a1f04"/>
  <!-- Cello scroll -->
  <rect x="14" y="14" width="4" height="2" fill="#7e3f0c"/>
  <!-- Legs (knees apart) -->
  <rect x="6" y="24" width="6" height="14" fill="#1a0d02"/>
  <rect x="20" y="24" width="6" height="14" fill="#1a0d02"/>
  <!-- Bow held in right hand -->
  <rect x="20" y="22" width="11" height="1" fill="#c8a070"/>
  <rect x="20" y="23" width="11" height="1" fill="#3a1f04" opacity="0.6"/>
  <!-- Right arm -->
  <rect x="20" y="18" width="3" height="5" fill="var(--accent-3, #f3c07a)"/>
  <!-- Left arm holding cello neck -->
  <rect x="11" y="14" width="3" height="6" fill="var(--accent-3, #f3c07a)"/>
  <!-- Shoes -->
  <rect x="6" y="38" width="6" height="2" fill="#1a0d02"/>
  <rect x="20" y="38" width="6" height="2" fill="#1a0d02"/>
</svg>
