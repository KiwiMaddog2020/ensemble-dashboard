<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" width="32" height="48" shape-rendering="crispEdges" data-sprite-id="musician_viola" data-tags="music,viola,strings,musician,person">
  <!-- Hair -->
  <rect x="10" y="3" width="11" height="3" fill="#2a1810"/>
  <rect x="9" y="5" width="13" height="2" fill="#2a1810"/>
  <!-- Face -->
  <rect x="11" y="7" width="10" height="6" fill="#e8b288"/>
  <rect x="13" y="9" width="2" height="1" fill="#18150f"/>
  <rect x="17" y="9" width="2" height="1" fill="#18150f"/>
  <rect x="14" y="11" width="4" height="1" fill="#c2711f" opacity="0.5"/>
  <!-- Neck -->
  <rect x="13" y="13" width="6" height="1" fill="#e8b288"/>
  <!-- Shirt -->
  <rect x="10" y="14" width="12" height="14" fill="var(--accent-3, #f3c07a)"/>
  <rect x="14" y="15" width="4" height="2" fill="#0f0d0a" opacity="0.4"/>
  <!-- Pants -->
  <rect x="10" y="28" width="12" height="13" fill="#1a0d02"/>
  <!-- Viola body (slightly larger than violin) -->
  <rect x="1" y="10" width="2" height="8" fill="#7e3f0c"/>
  <rect x="3" y="8" width="8" height="12" fill="#a85c1a"/>
  <rect x="4" y="9" width="6" height="10" fill="#c87018"/>
  <rect x="5" y="11" width="2" height="1" fill="#18150f"/>
  <rect x="5" y="15" width="2" height="1" fill="#18150f"/>
  <!-- Bow -->
  <rect x="1" y="21" width="14" height="1" fill="#c8a070"/>
  <rect x="1" y="22" width="14" height="1" fill="#3a1f04" opacity="0.6"/>
  <!-- Right arm holding bow -->
  <rect x="13" y="18" width="2" height="5" fill="var(--accent-3, #f3c07a)"/>
  <rect x="12" y="21" width="2" height="2" fill="#e8b288"/>
  <!-- Left arm -->
  <rect x="7" y="14" width="3" height="6" fill="var(--accent-3, #f3c07a)"/>
  <rect x="5" y="18" width="3" height="2" fill="#e8b288"/>
  <!-- Shoes -->
  <rect x="10" y="41" width="5" height="2" fill="#1a0d02"/>
  <rect x="17" y="41" width="5" height="2" fill="#1a0d02"/>
</svg>
