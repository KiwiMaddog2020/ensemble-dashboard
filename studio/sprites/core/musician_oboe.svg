  <rect x="17" y="18" width="1" height="1" fill="#a8a8a8"/>
  <rect x="17" y="22" width="1" height="1" fill="#a8a8a8"/>
  <rect x="17" y="26" width="1" height="1" fill="#a8a8a8"/>
  <rect x="14" y="20" width="1" height="1" fill="#a8a8a8"/>
  <rect x="14" y="24" width="1" height="1" fill="#a8a8a8"/>
  <!-- Reed in mouth -->
