<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 48" width="40" height="48" shape-rendering="crispEdges" data-sprite-id="arcade_pinball" data-tags="game,pinball,interactive">
  <!-- Backbox marquee -->
