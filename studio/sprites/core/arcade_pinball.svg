  <rect x="26" y="17" width="3" height="3" fill="#22c55e"/>
  <rect x="26" y="17" width="3" height="1" fill="#86efac"/>
  <!-- Flippers -->
  <rect x="13" y="29" width="5" height="2" fill="var(--accent-2, #f3c07a)"/>
