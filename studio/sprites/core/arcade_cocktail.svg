<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 48" width="40" height="48" shape-rendering="crispEdges" data-sprite-id="arcade_cocktail" data-tags="game,arcade,cocktail,table,interactive">
  <!-- Top (table surface with screen) -->
  <rect x="4" y="14" width="32" height="14" fill="#1a0d02"/>
  <rect x="5" y="15" width="30" height="12" fill="#3a1f04"/>
  <!-- Inset screen -->
  <rect x="9" y="17" width="22" height="8" fill="#0a1428"/>
  <!-- Pixel game on screen -->
  <rect x="11" y="19" width="2" height="2" fill="#22c55e"/>
  <rect x="14" y="20" width="3" height="2" fill="var(--accent, #c2711f)"/>
  <rect x="18" y="19" width="2" height="2" fill="#ef4444"/>
  <rect x="22" y="20" width="3" height="2" fill="#3b82f6"/>
  <rect x="27" y="19" width="2" height="2" fill="var(--accent-2, #f3c07a)"/>
  <rect x="13" y="22" width="2" height="1" fill="#fbbf24"/>
  <rect x="20" y="23" width="3" height="1" fill="#ef4444"/>
  <rect x="26" y="22" width="2" height="1" fill="#22c55e"/>
  <!-- Top edge highlight -->
  <rect x="4" y="14" width="32" height="1" fill="#5c3318"/>
  <!-- Player 1 controls (left side, near edge) -->
  <rect x="3" y="21" width="3" height="3" fill="#1a0d02"/>
  <rect x="3" y="20" width="2" height="2" fill="#ef4444"/>
  <!-- Player 2 controls (right side) -->
  <rect x="34" y="18" width="3" height="3" fill="#1a0d02"/>
  <rect x="34" y="17" width="2" height="2" fill="#3b82f6"/>
  <!-- Legs (4 visible, two front two back perspective) -->
  <rect x="6" y="28" width="3" height="14" fill="#0f0d0a"/>
  <rect x="7" y="29" width="2" height="12" fill="#1a0d02"/>
  <rect x="31" y="28" width="3" height="14" fill="#0f0d0a"/>
  <rect x="32" y="29" width="2" height="12" fill="#1a0d02"/>
  <!-- Center support -->
  <rect x="19" y="28" width="2" height="14" fill="#0f0d0a"/>
  <!-- Floor base -->
  <rect x="4" y="42" width="32" height="3" fill="#0a0805"/>
  <rect x="3" y="45" width="34" height="3" fill="#000000"/>
</svg>
