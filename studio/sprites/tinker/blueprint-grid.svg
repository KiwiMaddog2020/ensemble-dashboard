<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Paper background -->
  <rect x="6" y="6" width="88" height="88" rx="3" fill="currentColor" opacity="0.06"/>
  <rect x="6" y="6" width="88" height="88" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <!-- Grid lines — major (every 20) -->
  <line x1="26" y1="6" x2="26" y2="94" stroke="currentColor" stroke-width="0.75" opacity="0.25"/>
  <line x1="46" y1="6" x2="46" y2="94" stroke="currentColor" stroke-width="0.75" opacity="0.25"/>
  <line x1="66" y1="6" x2="66" y2="94" stroke="currentColor" stroke-width="0.75" opacity="0.25"/>
  <line x1="86" y1="6" x2="86" y2="94" stroke="currentColor" stroke-width="0.75" opacity="0.25"/>
  <line x1="6" y1="26" x2="94" y2="26" stroke="currentColor" stroke-width="0.75" opacity="0.25"/>
  <line x1="6" y1="46" x2="94" y2="46" stroke="currentColor" stroke-width="0.75" opacity="0.25"/>
  <line x1="6" y1="66" x2="94" y2="66" stroke="currentColor" stroke-width="0.75" opacity="0.25"/>
  <line x1="6" y1="86" x2="94" y2="86" stroke="currentColor" stroke-width="0.75" opacity="0.25"/>
  <!-- Grid lines — minor (every 10) -->
  <line x1="16" y1="6" x2="16" y2="94" stroke="currentColor" stroke-width="0.4" opacity="0.12"/>
  <line x1="36" y1="6" x2="36" y2="94" stroke="currentColor" stroke-width="0.4" opacity="0.12"/>
  <line x1="56" y1="6" x2="56" y2="94" stroke="currentColor" stroke-width="0.4" opacity="0.12"/>
  <line x1="76" y1="6" x2="76" y2="94" stroke="currentColor" stroke-width="0.4" opacity="0.12"/>
  <line x1="6" y1="16" x2="94" y2="16" stroke="currentColor" stroke-width="0.4" opacity="0.12"/>
  <line x1="6" y1="36" x2="94" y2="36" stroke="currentColor" stroke-width="0.4" opacity="0.12"/>
  <line x1="6" y1="56" x2="94" y2="56" stroke="currentColor" stroke-width="0.4" opacity="0.12"/>
  <line x1="6" y1="76" x2="94" y2="76" stroke="currentColor" stroke-width="0.4" opacity="0.12"/>
  <!-- Center crosshair -->
  <line x1="50" y1="38" x2="50" y2="62" stroke="var(--accent, currentColor)" stroke-width="1" opacity="0.8"/>
  <line x1="38" y1="50" x2="62" y2="50" stroke="var(--accent, currentColor)" stroke-width="1" opacity="0.8"/>
  <!-- Technical circle -->
  <circle cx="50" cy="50" r="12" fill="none" stroke="var(--accent, currentColor)" stroke-width="1.5" opacity="0.7"/>
  <circle cx="50" cy="50" r="3" fill="var(--accent, currentColor)" opacity="0.8"/>
  <!-- Dimension tick marks -->
  <line x1="38" y1="46" x2="38" y2="54" stroke="currentColor" stroke-width="0.75" opacity="0.5"/>
  <line x1="62" y1="46" x2="62" y2="54" stroke="currentColor" stroke-width="0.75" opacity="0.5"/>
  <line x1="46" y1="38" x2="54" y2="38" stroke="currentColor" stroke-width="0.75" opacity="0.5"/>
  <line x1="46" y1="62" x2="54" y2="62" stroke="currentColor" stroke-width="0.75" opacity="0.5"/>
</svg>
