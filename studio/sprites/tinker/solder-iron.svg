<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Handle grip (right side) -->
  <rect x="52" y="42" width="36" height="16" rx="8" fill="currentColor" opacity="0.2"/>
  <rect x="53" y="43" width="34" height="14" rx="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- Grip texture lines -->
  <line x1="64" y1="44" x2="64" y2="56" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <line x1="70" y1="44" x2="70" y2="56" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <line x1="76" y1="44" x2="76" y2="56" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <!-- Heating element barrel -->
  <rect x="30" y="44" width="24" height="12" rx="2" fill="currentColor" opacity="0.3"/>
  <rect x="31" y="45" width="22" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <!-- Element band rings -->
  <line x1="37" y1="45" x2="37" y2="55" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <line x1="43" y1="45" x2="43" y2="55" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <!-- Tip shaft -->
  <rect x="14" y="47" width="18" height="6" rx="1" fill="currentColor" opacity="0.4"/>
  <!-- Conical tip -->
  <path d="M 14 47 L 8 50 L 14 53 Z" fill="var(--accent, currentColor)" opacity="0.9"/>
  <!-- Heat glow at tip -->
  <circle cx="9" cy="50" r="4" fill="var(--accent, currentColor)" opacity="0.15"/>
  <circle cx="9" cy="50" r="2" fill="var(--accent, currentColor)" opacity="0.25"/>
  <!-- Heat waves above tip -->
  <path d="M 12 44 Q 14 40 12 36" fill="none" stroke="var(--accent, currentColor)" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <path d="M 16 43 Q 18 38 16 34" fill="none" stroke="var(--accent, currentColor)" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  <!-- Power cord -->
  <path d="M 88 50 Q 94 50 94 56 Q 94 62 90 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <circle cx="90" cy="65" r="2" fill="currentColor" opacity="0.35"/>
</svg>
