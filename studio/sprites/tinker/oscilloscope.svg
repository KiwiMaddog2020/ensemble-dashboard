<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Instrument body -->
  <rect x="6" y="12" width="88" height="76" rx="4" fill="currentColor" opacity="0.1"/>
  <rect x="7" y="13" width="86" height="74" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- CRT screen bezel -->
  <rect x="12" y="16" width="60" height="52" rx="4" fill="currentColor" opacity="0.15"/>
  <!-- Screen glass -->
  <rect x="15" y="19" width="54" height="46" rx="3" fill="currentColor" opacity="0.08"/>
  <!-- Screen grid lines -->
  <line x1="24" y1="19" x2="24" y2="65" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
  <line x1="33" y1="19" x2="33" y2="65" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
  <line x1="42" y1="19" x2="42" y2="65" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
  <line x1="51" y1="19" x2="51" y2="65" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
  <line x1="60" y1="19" x2="60" y2="65" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
  <line x1="15" y1="28" x2="69" y2="28" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
  <line x1="15" y1="37" x2="69" y2="37" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
  <line x1="15" y1="46" x2="69" y2="46" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
  <line x1="15" y1="55" x2="69" y2="55" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
  <!-- Sine wave trace -->
  <path d="M 15 42 Q 21 28 27 42 Q 33 56 39 42 Q 45 28 51 42 Q 57 56 63 42 Q 66 35 69 38"
        fill="none" stroke="var(--accent, currentColor)" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <!-- Trigger marker -->
  <line x1="42" y1="19" x2="42" y2="22" stroke="var(--accent, currentColor)" stroke-width="1.5" opacity="0.8"/>
  <!-- Control knobs -->
  <circle cx="80" cy="27" r="5" fill="currentColor" opacity="0.2"/>
  <circle cx="80" cy="27" r="5" fill="none" stroke="currentColor" stroke-width="1"/>
  <line x1="80" y1="22" x2="80" y2="25" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
  <circle cx="80" cy="44" r="5" fill="currentColor" opacity="0.2"/>
  <circle cx="80" cy="44" r="5" fill="none" stroke="currentColor" stroke-width="1"/>
  <line x1="83.5" y1="40.5" x2="81.5" y2="42.5" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
  <circle cx="80" cy="61" r="5" fill="currentColor" opacity="0.2"/>
  <circle cx="80" cy="61" r="5" fill="none" stroke="currentColor" stroke-width="1"/>
  <line x1="80" y1="66" x2="80" y2="63" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
  <!-- Power LED -->
  <circle cx="80" cy="74" r="3" fill="var(--accent, currentColor)" opacity="0.8"/>
  <!-- Input BNC jacks -->
  <circle cx="20" cy="82" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <circle cx="20" cy="82" r="1" fill="currentColor" opacity="0.5"/>
  <circle cx="32" cy="82" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <circle cx="32" cy="82" r="1" fill="currentColor" opacity="0.5"/>
</svg>
