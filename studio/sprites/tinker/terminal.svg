<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Monitor bezel -->
  <rect x="8" y="10" width="84" height="66" rx="5" fill="currentColor" opacity="0.1"/>
  <rect x="9" y="11" width="82" height="64" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="9" y="11" width="82" height="14" rx="4" fill="currentColor" opacity="0.18"/>
  <rect x="9" y="18" width="82" height="7" fill="currentColor" opacity="0.18"/>
  <!-- Traffic lights -->
  <circle cx="20" cy="18" r="3" fill="var(--accent, currentColor)" opacity="0.85"/>
  <circle cx="29" cy="18" r="3" fill="currentColor" opacity="0.25"/>
  <circle cx="38" cy="18" r="3" fill="currentColor" opacity="0.25"/>
  <!-- Screen area -->
  <rect x="13" y="29" width="74" height="44" rx="2" fill="currentColor" opacity="0.04"/>
  <!-- Prompt indicator -->
  <rect x="17" y="34" width="8" height="2.5" rx="1" fill="var(--accent, currentColor)" opacity="0.9"/>
  <rect x="27" y="34" width="36" height="2.5" rx="1" fill="currentColor" opacity="0.55"/>
  <!-- Code lines -->
  <rect x="17" y="41" width="52" height="2" rx="1" fill="currentColor" opacity="0.35"/>
  <rect x="17" y="47" width="44" height="2" rx="1" fill="currentColor" opacity="0.45"/>
  <rect x="17" y="53" width="28" height="2" rx="1" fill="currentColor" opacity="0.25"/>
  <!-- Active prompt -->
  <rect x="17" y="59" width="8" height="2.5" rx="1" fill="var(--accent, currentColor)" opacity="0.9"/>
  <!-- Blinking cursor block -->
  <rect x="27" y="57.5" width="5" height="5" rx="0.5" fill="var(--accent, currentColor)" opacity="0.75"/>
  <!-- Stand neck -->
  <rect x="44" y="76" width="12" height="6" rx="1" fill="currentColor" opacity="0.3"/>
  <!-- Stand base -->
  <rect x="35" y="82" width="30" height="4" rx="2" fill="currentColor" opacity="0.22"/>
</svg>
