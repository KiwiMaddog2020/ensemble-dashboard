<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- PCB substrate -->
  <rect x="6" y="6" width="88" height="88" rx="4" fill="currentColor" opacity="0.06"/>
  <rect x="7" y="7" width="86" height="86" rx="3" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <!-- Routing traces — horizontal -->
  <line x1="14" y1="30" x2="40" y2="30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <line x1="60" y1="30" x2="86" y2="30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <line x1="14" y1="70" x2="40" y2="70" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <line x1="60" y1="70" x2="86" y2="70" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <line x1="14" y1="50" x2="86" y2="50" stroke="var(--accent, currentColor)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Routing traces — vertical -->
  <line x1="40" y1="14" x2="40" y2="30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <line x1="40" y1="50" x2="40" y2="70" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <line x1="60" y1="14" x2="60" y2="30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <line x1="60" y1="50" x2="60" y2="70" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <!-- Corner pads -->
  <circle cx="40" cy="30" r="5" fill="currentColor" opacity="0.3"/>
  <circle cx="40" cy="30" r="2.5" fill="var(--accent, currentColor)" opacity="0.7"/>
  <circle cx="60" cy="30" r="5" fill="currentColor" opacity="0.3"/>
  <circle cx="60" cy="30" r="2.5" fill="var(--accent, currentColor)" opacity="0.7"/>
  <circle cx="40" cy="70" r="5" fill="currentColor" opacity="0.3"/>
  <circle cx="40" cy="70" r="2.5" fill="var(--accent, currentColor)" opacity="0.7"/>
  <circle cx="60" cy="70" r="5" fill="currentColor" opacity="0.3"/>
  <circle cx="60" cy="70" r="2.5" fill="var(--accent, currentColor)" opacity="0.7"/>
  <!-- Center via -->
  <circle cx="50" cy="50" r="7" fill="currentColor" opacity="0.2"/>
  <circle cx="50" cy="50" r="7" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <circle cx="50" cy="50" r="3" fill="var(--accent, currentColor)" opacity="0.85"/>
  <!-- Edge vias -->
  <circle cx="14" cy="50" r="4" fill="currentColor" opacity="0.25"/>
  <circle cx="14" cy="50" r="4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <circle cx="14" cy="50" r="1.5" fill="currentColor" opacity="0.6"/>
  <circle cx="86" cy="50" r="4" fill="currentColor" opacity="0.25"/>
  <circle cx="86" cy="50" r="4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <circle cx="86" cy="50" r="1.5" fill="currentColor" opacity="0.6"/>
  <!-- Edge mounting holes -->
  <circle cx="14" cy="14" r="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
  <circle cx="86" cy="14" r="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
  <circle cx="14" cy="86" r="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
  <circle cx="86" cy="86" r="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
</svg>
