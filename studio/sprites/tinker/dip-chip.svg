<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- IC body -->
  <rect x="24" y="22" width="52" height="56" rx="3" fill="currentColor" opacity="0.18"/>
  <rect x="25" y="23" width="50" height="54" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Notch indicator at top -->
  <path d="M 44 23 A 6 6 0 0 1 56 23" fill="currentColor" opacity="0.35"/>
  <!-- Pin 1 dot -->
  <circle cx="32" cy="32" r="2.5" fill="var(--accent, currentColor)" opacity="0.85"/>
  <!-- Part number lines (silk screen) -->
  <rect x="32" y="44" width="36" height="2" rx="1" fill="currentColor" opacity="0.3"/>
  <rect x="35" y="49" width="30" height="2" rx="1" fill="currentColor" opacity="0.2"/>
  <rect x="38" y="54" width="24" height="2" rx="1" fill="currentColor" opacity="0.15"/>
  <!-- Left pins (4) -->
  <rect x="10" y="28" width="15" height="5" rx="1" fill="currentColor" opacity="0.5"/>
  <rect x="10" y="39" width="15" height="5" rx="1" fill="currentColor" opacity="0.5"/>
  <rect x="10" y="50" width="15" height="5" rx="1" fill="currentColor" opacity="0.5"/>
  <rect x="10" y="61" width="15" height="5" rx="1" fill="currentColor" opacity="0.5"/>
  <!-- Left pin tips -->
  <rect x="10" y="29" width="3" height="3" rx="0.5" fill="var(--accent, currentColor)" opacity="0.5"/>
  <rect x="10" y="40" width="3" height="3" rx="0.5" fill="var(--accent, currentColor)" opacity="0.5"/>
  <rect x="10" y="51" width="3" height="3" rx="0.5" fill="var(--accent, currentColor)" opacity="0.5"/>
  <rect x="10" y="62" width="3" height="3" rx="0.5" fill="var(--accent, currentColor)" opacity="0.5"/>
  <!-- Right pins (4) -->
  <rect x="75" y="28" width="15" height="5" rx="1" fill="currentColor" opacity="0.5"/>
  <rect x="75" y="39" width="15" height="5" rx="1" fill="currentColor" opacity="0.5"/>
  <rect x="75" y="50" width="15" height="5" rx="1" fill="currentColor" opacity="0.5"/>
  <rect x="75" y="61" width="15" height="5" rx="1" fill="currentColor" opacity="0.5"/>
  <!-- Right pin tips -->
  <rect x="87" y="29" width="3" height="3" rx="0.5" fill="var(--accent, currentColor)" opacity="0.5"/>
  <rect x="87" y="40" width="3" height="3" rx="0.5" fill="var(--accent, currentColor)" opacity="0.5"/>
  <rect x="87" y="51" width="3" height="3" rx="0.5" fill="var(--accent, currentColor)" opacity="0.5"/>
  <rect x="87" y="62" width="3" height="3" rx="0.5" fill="var(--accent, currentColor)" opacity="0.5"/>
</svg>
