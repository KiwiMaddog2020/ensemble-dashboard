<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sheet of paper — slight tilt for life -->
  <rect x="14" y="10" width="72" height="88" rx="2" fill="currentColor" opacity="0.1"/>
  <rect x="15" y="11" width="70" height="86" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <!-- Subtle fold shadow at top-right corner -->
  <path d="M 69 11 L 85 11 L 85 27 Z" fill="currentColor" opacity="0.08"/>
  <path d="M 69 11 L 85 27 L 69 27 Z" fill="currentColor" opacity="0.12"/>
  <line x1="69" y1="11" x2="85" y2="27" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <!-- Ruled lines -->
  <line x1="20" y1="30" x2="80" y2="30" stroke="currentColor" stroke-width="0.75" opacity="0.3"/>
  <line x1="20" y1="38" x2="80" y2="38" stroke="currentColor" stroke-width="0.75" opacity="0.3"/>
  <line x1="20" y1="46" x2="80" y2="46" stroke="currentColor" stroke-width="0.75" opacity="0.3"/>
  <line x1="20" y1="54" x2="80" y2="54" stroke="currentColor" stroke-width="0.75" opacity="0.3"/>
  <line x1="20" y1="62" x2="80" y2="62" stroke="currentColor" stroke-width="0.75" opacity="0.3"/>
  <line x1="20" y1="70" x2="80" y2="70" stroke="currentColor" stroke-width="0.75" opacity="0.3"/>
  <line x1="20" y1="78" x2="80" y2="78" stroke="currentColor" stroke-width="0.75" opacity="0.3"/>
  <!-- Left margin line -->
  <line x1="28" y1="20" x2="28" y2="90" stroke="var(--accent, currentColor)" stroke-width="0.75" opacity="0.5"/>
  <!-- Top margin line -->
  <line x1="15" y1="22" x2="85" y2="22" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
</svg>
