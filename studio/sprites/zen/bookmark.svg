<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Bookmark ribbon body -->
  <path d="M 28 8 L 72 8 L 72 84 L 50 72 L 28 84 Z" fill="var(--accent, currentColor)" opacity="0.2"/>
  <path d="M 28 8 L 72 8 L 72 84 L 50 72 L 28 84 Z" fill="none" stroke="var(--accent, currentColor)" stroke-width="2" opacity="0.8"/>
  <!-- Decorative top border stripe -->
  <rect x="28" y="8" width="44" height="5" rx="0" fill="var(--accent, currentColor)" opacity="0.4"/>
  <!-- Embossed panel lines on bookmark -->
  <rect x="34" y="18" width="32" height="1.5" rx="0.75" fill="currentColor" opacity="0.3"/>
  <rect x="34" y="23" width="32" height="1.5" rx="0.75" fill="currentColor" opacity="0.3"/>
  <!-- Center ornament — simple diamond -->
  <path d="M 50 38 L 58 50 L 50 62 L 42 50 Z" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <circle cx="50" cy="50" r="4" fill="currentColor" opacity="0.2"/>
  <circle cx="50" cy="50" r="4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <!-- Tassel loop at top -->
  <circle cx="50" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <!-- Tassel threads (hanging below point) -->
  <line x1="47" y1="84" x2="45" y2="96" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <line x1="50" y1="84" x2="50" y2="97" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <line x1="53" y1="84" x2="55" y2="96" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
</svg>
