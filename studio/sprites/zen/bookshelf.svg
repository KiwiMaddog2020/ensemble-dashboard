<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shelf planks -->
  <rect x="6" y="60" width="88" height="6" rx="1.5" fill="currentColor" opacity="0.4"/>
  <rect x="6" y="88" width="88" height="6" rx="1.5" fill="currentColor" opacity="0.3"/>
  <!-- Left wall upright -->
  <rect x="6" y="8" width="6" height="88" rx="2" fill="currentColor" opacity="0.3"/>
  <!-- Right wall upright -->
  <rect x="88" y="8" width="6" height="88" rx="2" fill="currentColor" opacity="0.3"/>
  <!-- Books on top shelf (varying heights) -->
  <!-- Book 1 — tall, accent -->
  <rect x="16" y="24" width="9" height="36" rx="1" fill="var(--accent, currentColor)" opacity="0.7"/>
  <rect x="17" y="25" width="7" height="34" rx="0.5" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
  <!-- Book 2 — medium -->
  <rect x="26" y="32" width="8" height="28" rx="1" fill="currentColor" opacity="0.35"/>
  <!-- Book 3 — short, accent-2 -->
  <rect x="35" y="38" width="7" height="22" rx="1" fill="var(--accent-2, currentColor)" opacity="0.55"/>
  <!-- Book 4 — tall -->
  <rect x="43" y="22" width="10" height="38" rx="1" fill="currentColor" opacity="0.28"/>
  <!-- Book 5 — medium, slightly tilted effect -->
  <rect x="54" y="30" width="8" height="30" rx="1" fill="var(--accent, currentColor)" opacity="0.45"/>
  <!-- Book 6 — short -->
  <rect x="63" y="40" width="7" height="20" rx="1" fill="currentColor" opacity="0.4"/>
  <!-- Book 7 — tall -->
  <rect x="71" y="26" width="9" height="34" rx="1" fill="currentColor" opacity="0.3"/>
  <!-- Small ornament / bookend -->
  <circle cx="82" cy="57" r="3" fill="currentColor" opacity="0.3"/>
  <circle cx="82" cy="57" r="3" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <!-- Books on bottom shelf -->
  <rect x="16" y="68" width="12" height="20" rx="1" fill="currentColor" opacity="0.3"/>
  <rect x="29" y="70" width="9" height="18" rx="1" fill="var(--accent, currentColor)" opacity="0.4"/>
  <rect x="39" y="68" width="14" height="20" rx="1" fill="currentColor" opacity="0.22"/>
  <rect x="54" y="72" width="8" height="16" rx="1" fill="currentColor" opacity="0.3"/>
  <rect x="63" y="68" width="10" height="20" rx="1" fill="var(--accent-2, currentColor)" opacity="0.4"/>
</svg>
