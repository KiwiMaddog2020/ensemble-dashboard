<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer wax blob — slightly irregular circle -->
  <circle cx="50" cy="50" r="38" fill="var(--accent, currentColor)" opacity="0.25"/>
  <!-- Wax surface texture rings -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="var(--accent, currentColor)" stroke-width="2.5" opacity="0.55"/>
  <circle cx="50" cy="50" r="32" fill="none" stroke="var(--accent, currentColor)" stroke-width="1" opacity="0.3"/>
  <!-- Embossed inner ring -->
  <circle cx="50" cy="50" r="26" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <!-- Embossed star / rosette pattern in center -->
  <!-- 8-point star using rotated rectangles -->
  <rect x="47" y="34" width="6" height="32" rx="3" fill="currentColor" opacity="0.25"/>
  <rect x="47" y="34" width="6" height="32" rx="3" fill="currentColor" opacity="0.25" transform="rotate(45 50 50)"/>
  <rect x="47" y="34" width="6" height="32" rx="3" fill="currentColor" opacity="0.25" transform="rotate(90 50 50)"/>
  <rect x="47" y="34" width="6" height="32" rx="3" fill="currentColor" opacity="0.25" transform="rotate(135 50 50)"/>
  <!-- Center circle of seal -->
  <circle cx="50" cy="50" r="8" fill="currentColor" opacity="0.3"/>
  <circle cx="50" cy="50" r="8" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <circle cx="50" cy="50" r="3" fill="currentColor" opacity="0.5"/>
  <!-- Wax drip at bottom -->
  <path d="M 38 86 C 36 90 40 94 44 92 C 46 94 50 96 54 94 C 58 96 62 90 60 86"
    fill="var(--accent, currentColor)" opacity="0.3"/>
</svg>
