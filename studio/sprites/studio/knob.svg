<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Knob body — circular potentiometer -->
  <circle cx="50" cy="50" r="34" fill="currentColor" opacity="0.1"/>
  <circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="2" opacity="0.4"/>
  <!-- Knob face -->
  <circle cx="50" cy="50" r="26" fill="currentColor" opacity="0.2"/>
  <circle cx="50" cy="50" r="26" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Tick marks around bezel (9 ticks, 270° range) -->
  <line x1="50" y1="17" x2="50" y2="22" stroke="currentColor" stroke-width="1.5" opacity="0.4" transform="rotate(-135 50 50)"/>
  <line x1="50" y1="17" x2="50" y2="22" stroke="currentColor" stroke-width="1.5" opacity="0.4" transform="rotate(-101 50 50)"/>
  <line x1="50" y1="17" x2="50" y2="22" stroke="currentColor" stroke-width="1.5" opacity="0.4" transform="rotate(-67 50 50)"/>
  <line x1="50" y1="17" x2="50" y2="22" stroke="currentColor" stroke-width="1.5" opacity="0.4" transform="rotate(-33 50 50)"/>
  <line x1="50" y1="17" x2="50" y2="22" stroke="currentColor" stroke-width="2" opacity="0.6" transform="rotate(0 50 50)"/>
  <line x1="50" y1="17" x2="50" y2="22" stroke="currentColor" stroke-width="1.5" opacity="0.4" transform="rotate(33 50 50)"/>
  <line x1="50" y1="17" x2="50" y2="22" stroke="currentColor" stroke-width="1.5" opacity="0.4" transform="rotate(67 50 50)"/>
  <line x1="50" y1="17" x2="50" y2="22" stroke="currentColor" stroke-width="1.5" opacity="0.4" transform="rotate(101 50 50)"/>
  <line x1="50" y1="17" x2="50" y2="22" stroke="currentColor" stroke-width="1.5" opacity="0.4" transform="rotate(135 50 50)"/>
  <!-- Pointer indicator — accent color -->
  <line x1="50" y1="28" x2="50" y2="38" stroke="var(--accent, currentColor)" stroke-width="3" stroke-linecap="round" opacity="0.9" transform="rotate(40 50 50)"/>
  <!-- Center hub -->
  <circle cx="50" cy="50" r="7" fill="currentColor" opacity="0.4"/>
  <circle cx="50" cy="50" r="7" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="50" cy="50" r="2.5" fill="currentColor" opacity="0.7"/>
</svg>
