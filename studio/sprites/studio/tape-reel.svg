<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Reel outer flange -->
  <circle cx="50" cy="50" r="42" fill="currentColor" opacity="0.12"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Tape wound on reel — simulated by concentric rings -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
  <circle cx="50" cy="50" r="24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.25"/>
  <!-- Hub circle -->
  <circle cx="50" cy="50" r="18" fill="currentColor" opacity="0.2"/>
  <circle cx="50" cy="50" r="18" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Hub spokes — 3-spoke style -->
  <line x1="50" y1="32" x2="50" y2="50" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="50" y1="32" x2="50" y2="50" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity="0.5" transform="rotate(120 50 50)"/>
  <line x1="50" y1="32" x2="50" y2="50" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity="0.5" transform="rotate(240 50 50)"/>
  <!-- Center hub hole -->
  <circle cx="50" cy="50" r="7" fill="currentColor" opacity="0.4"/>
  <circle cx="50" cy="50" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="3" fill="var(--accent, currentColor)" opacity="0.7"/>
  <!-- Tape tail coming off reel (small strip) -->
  <path d="M 88 50 C 92 50 92 54 90 56 C 88 58 86 58 84 58" fill="none" stroke="var(--accent, currentColor)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>
