<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fader track background -->
  <rect x="44" y="8" width="12" height="84" rx="6" fill="currentColor" opacity="0.1"/>
  <rect x="45" y="9" width="10" height="82" rx="5" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <!-- Track center channel -->
  <rect x="49" y="12" width="2" height="76" rx="1" fill="currentColor" opacity="0.3"/>
  <!-- Scale marks — left side -->
  <line x1="40" y1="16" x2="44" y2="16" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <line x1="42" y1="28" x2="44" y2="28" stroke="currentColor" stroke-width="0.75" opacity="0.25"/>
  <line x1="40" y1="40" x2="44" y2="40" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <line x1="42" y1="52" x2="44" y2="52" stroke="currentColor" stroke-width="0.75" opacity="0.25"/>
  <line x1="40" y1="64" x2="44" y2="64" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <line x1="42" y1="76" x2="44" y2="76" stroke="currentColor" stroke-width="0.75" opacity="0.25"/>
  <line x1="40" y1="88" x2="44" y2="88" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <!-- Scale marks — right side (mirror) -->
  <line x1="56" y1="16" x2="60" y2="16" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <line x1="56" y1="28" x2="58" y2="28" stroke="currentColor" stroke-width="0.75" opacity="0.25"/>
  <line x1="56" y1="40" x2="60" y2="40" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <line x1="56" y1="52" x2="58" y2="52" stroke="currentColor" stroke-width="0.75" opacity="0.25"/>
  <line x1="56" y1="64" x2="60" y2="64" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <line x1="56" y1="76" x2="58" y2="76" stroke="currentColor" stroke-width="0.75" opacity="0.25"/>
  <line x1="56" y1="88" x2="60" y2="88" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <!-- Unity gain mark (0 dB) — accent -->
  <line x1="39" y1="52" x2="44" y2="52" stroke="var(--accent, currentColor)" stroke-width="1.5" opacity="0.7"/>
  <line x1="56" y1="52" x2="61" y2="52" stroke="var(--accent, currentColor)" stroke-width="1.5" opacity="0.7"/>
  <!-- Fader cap — at ~35% position (above unity) -->
  <rect x="36" y="30" width="28" height="16" rx="4" fill="currentColor" opacity="0.3"/>
  <rect x="37" y="31" width="26" height="14" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Fader cap accent line -->
  <line x1="38" y1="38" x2="62" y2="38" stroke="var(--accent, currentColor)" stroke-width="1.5" opacity="0.8"/>
  <!-- Cap grip ridges -->
  <line x1="46" y1="33" x2="46" y2="43" stroke="currentColor" stroke-width="0.75" opacity="0.3"/>
  <line x1="50" y1="33" x2="50" y2="43" stroke="currentColor" stroke-width="0.75" opacity="0.3"/>
  <line x1="54" y1="33" x2="54" y2="43" stroke="currentColor" stroke-width="0.75" opacity="0.3"/>
</svg>
