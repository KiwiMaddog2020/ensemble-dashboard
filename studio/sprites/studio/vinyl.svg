<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Record outer edge -->
  <circle cx="50" cy="50" r="44" fill="currentColor" opacity="0.7"/>
  <!-- Groove rings — simulate vinyl grooves -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.5"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3"/>
  <circle cx="50" cy="50" r="36" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3"/>
  <circle cx="50" cy="50" r="32" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3"/>
  <!-- Lead-in / lead-out gap ring -->
  <circle cx="50" cy="50" r="24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <!-- Center label -->
  <circle cx="50" cy="50" r="20" fill="var(--accent, currentColor)" opacity="0.25"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="var(--accent, currentColor)" stroke-width="1.5" opacity="0.7"/>
  <!-- Label text lines -->
  <rect x="36" y="46" width="28" height="2" rx="1" fill="currentColor" opacity="0.3"/>
  <rect x="39" y="51" width="22" height="1.5" rx="0.75" fill="currentColor" opacity="0.2"/>
  <!-- Spindle hole -->
  <circle cx="50" cy="50" r="3.5" fill="currentColor" opacity="0.8"/>
  <circle cx="50" cy="50" r="3.5" fill="none" stroke="currentColor" stroke-width="1"/>
  <!-- Reflection highlight on record surface -->
  <ellipse cx="36" cy="36" rx="7" ry="4" fill="currentColor" opacity="0.08" transform="rotate(-30 36 36)"/>
</svg>
