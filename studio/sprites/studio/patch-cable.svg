<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Jack plug body — left side -->
  <rect x="6" y="44" width="20" height="12" rx="6" fill="currentColor" opacity="0.3"/>
  <rect x="7" y="45" width="18" height="10" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- Tip sleeve rings on left plug -->
  <rect x="16" y="45" width="3" height="10" rx="0.5" fill="currentColor" opacity="0.4"/>
  <rect x="21" y="46" width="4" height="8" rx="4" fill="currentColor" opacity="0.35"/>
  <!-- Cable — curving through middle -->
  <path d="M 26 50 C 36 50 36 28 50 28 C 64 28 64 72 74 72 C 80 72 80 50 74 50"
    fill="none" stroke="var(--accent, currentColor)" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <!-- Cable highlight/shadow -->
  <path d="M 26 50 C 36 50 36 28 50 28 C 64 28 64 72 74 72 C 80 72 80 50 74 50"
    fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" opacity="0.15"/>
  <path d="M 26 50 C 36 50 36 28 50 28 C 64 28 64 72 74 72 C 80 72 80 50 74 50"
    fill="none" stroke="var(--accent, currentColor)" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <!-- Jack plug body — right side -->
  <rect x="74" y="44" width="20" height="12" rx="6" fill="currentColor" opacity="0.3"/>
  <rect x="75" y="45" width="18" height="10" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- Tip sleeve rings on right plug -->
  <rect x="81" y="45" width="3" height="10" rx="0.5" fill="currentColor" opacity="0.4"/>
  <rect x="75" y="46" width="4" height="8" rx="4" fill="currentColor" opacity="0.35"/>
  <!-- Strain relief grooves left -->
  <line x1="10" y1="46" x2="10" y2="54" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <line x1="13" y1="46" x2="13" y2="54" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <!-- Strain relief grooves right -->
  <line x1="87" y1="46" x2="87" y2="54" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <line x1="90" y1="46" x2="90" y2="54" stroke="currentColor" stroke-width="1" opacity="0.3"/>
</svg>
